<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autorizado · Historias Protagonizadas</title><style>:root{color-scheme:dark}body{margin:0;background:#0b0d16;color:#e9e4da;font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 20px}h1{font-size:28px;margin:0 0 8px;color:#fff}h2{font-size:19px;margin-top:28px;color:#fff}
a{color:#d8f046}.tag{display:inline-block;background:#e5352b;color:#fff;padding:2px 10px;border-radius:6px;font-weight:700;font-size:13px}
code,#codigo{background:#161a28;border:1px solid #2a3046;border-radius:8px;padding:12px;display:block;word-break:break-all;font:15px ui-monospace,Consolas,monospace;color:#d8f046}
button{margin-top:12px;background:#d8f046;color:#111;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}footer{margin-top:40px;color:#8a8fa0;font-size:13px}</style></head><body><main><h1>Autorización recibida</h1>
<p>Copia este código y pégalo en <b>tiktok.codigo</b> dentro de <b>.secretos/credenciales.json</b>. Caduca en pocos minutos y sirve una sola vez.</p>
<div id="codigo">(sin código)</div><button onclick="navigator.clipboard.writeText(document.getElementById('codigo').textContent)">Copiar código</button>
<p id="err"></p><footer>Historias Protagonizadas · @historiasprotagonizadas · Contacto: mensaje directo a @historiasprotagonizadas en Instagram</footer></main><script>const p=new URLSearchParams(location.search);const c=p.get('code');if(c){document.getElementById('codigo').textContent=c}
const e=p.get('error');if(e){document.getElementById('err').textContent='Error: '+e+' '+(p.get('error_description')||'')}</script></body></html>
